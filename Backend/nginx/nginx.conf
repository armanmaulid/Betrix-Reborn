# ─────────────────────────────────────────────────────────────────────────────
# Betrix Reborn — nginx reverse proxy (HTTPS / local dev)
# ─────────────────────────────────────────────────────────────────────────────
# Terminates TLS and routes:
#   /api/v1/*, /health, /docs   → Fastify backend  (host:3000)
#   everything else             → Next.js admin    (host:3001)
#
# Realtime is Server-Sent Events (SSE), NOT WebSocket — the /stream/, /chat/,
# and /metrics/ endpoints need proxy_buffering off so frames flush immediately.
#
# Run from docker-compose (see ../docker-compose.nginx.yml). Backend/frontend
# keep running with `pnpm dev` on the host; nginx reaches them via
# host.docker.internal on Windows/macOS (on Linux set DOCKER_GATEWAY_HOST).
# ─────────────────────────────────────────────────────────────────────────────

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;

  # ── TLS: serve local https://betrix.local (mkcert) ─────────────────────
  server {
    listen       443 ssl;
    http2        on;
    server_name  betrix.local;

    ssl_certificate     /etc/nginx/certs/betrix.local.pem;
    ssl_certificate_key /etc/nginx/certs/betrix.local-key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Gzip for JSON/JS payloads.
    gzip              on;
    gzip_types        application/json application/javascript text/css;

    # Preserve client IP / proto so Fastify (trustProxy) and Next.js
    # (Secure cookie detection) see the real origin over HTTPS.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ── Fastify backend ────────────────────────────────────────────────────
    # SSE: buffering MUST be off or frames batch up and the stream stalls.
    location ~ ^/(api/v1|health|docs) {
      proxy_pass          http://host.docker.internal:3000;
      proxy_http_version  1.1;
      proxy_set_header    Connection "";
      proxy_buffering     off;
      proxy_cache         off;
      proxy_read_timeout  1h;
      proxy_send_timeout  1h;
    }

    # ── Next.js admin (everything else) ────────────────────────────────────
    location / {
      proxy_pass          http://host.docker.internal:3001;
      proxy_http_version  1.1;
      proxy_set_header    Upgrade $http_upgrade;
      proxy_set_header    Connection "upgrade";   # HMR websocket if ever used
      proxy_buffering     off;                    # safe for Next streaming too
      proxy_read_timeout  1h;
    }
  }

  # Redirect plain HTTP → HTTPS.
  server {
    listen       80;
    server_name  betrix.local;
    return       301 https://$host$request_uri;
  }
}
